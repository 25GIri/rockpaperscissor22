<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        .choices {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ffffff;
            color: #1e3c72;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        .results {
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    
    <div class="choices">
        <button onclick="play('rock')">Rock ✊</button>
        <button onclick="play('paper')">Paper ✋</button>
        <button onclick="play('scissors')">Scissors ✌️</button>
    </div>

    <div class="results" id="results">
        <p id="player-choice"></p>
        <p id="computer-choice"></p>
        <p id="winner"></p>
    </div>

    <script>
        function play(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            
            document.getElementById('player-choice').innerText = `You chose: ${playerChoice}`;
            document.getElementById('computer-choice').innerText = `Computer chose: ${computerChoice}`;
            
            let result = '';
            if (playerChoice === computerChoice) {
                result = "It's a tie!";
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = 'You win! 🎉';
            } else {
                result = 'Computer wins! 🤖';
            }
            
            document.getElementById('winner').innerText = result;
        }
    </script>

</body>
</html>
