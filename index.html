<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            letter-spacing: 1px;
            color: #ffaa00;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
        }

        .score-item span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            margin-top: 0.3rem;
            color: #4da6ff;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .choice-btn {
            background: #33334d;
            border: 2px solid transparent;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .choice-btn:hover {
            background: #4d4d73;
            transform: translateY(-5px);
            border-color: #ffaa00;
        }

        .choice-btn:active {
            transform: translateY(0);
        }

        .result-area {
            margin-bottom: 1.5rem;
            min-height: 80px;
        }

        .choices-display {
            font-size: 1rem;
            color: #b3b3cc;
            margin-bottom: 0.5rem;
        }

        .winner-text {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .reset-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="scoreboard">
            <div class="score-item">
                Player <span id="player-score">0</span>
            </div>
            <div class="score-item">
                Computer <span id="computer-score">0</span>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" onclick="playGame('rock')" title="Rock">✊</button>
            <button class="choice-btn" onclick="playGame('paper')" title="Paper">✋</button>
            <button class="choice-btn" onclick="playGame('scissors')" title="Scissors">✌️</button>
        </div>

        <div class="result-area">
            <div class="choices-display" id="choices-display">Choose your weapon!</div>
            <div class="winner-text" id="winner-text"></div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Score</button>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;

        const emojis = {
            rock: '✊',
            paper: '✋',
            scissors: '✌️'
        };

        function playGame(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];

            document.getElementById('choices-display').innerHTML = 
                `You chose ${emojis[playerChoice]} vs Computer chose ${emojis[computerChoice]}`;

            let result = '';

            if (playerChoice === computerChoice) {
                result = "It's a Tie!";
                document.getElementById('winner-text').style.color = '#ffaa00';
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = "You Win! 🎉";
                playerScore++;
                document.getElementById('winner-text').style.color = '#4dff4d';
            } else {
                result = "Computer Wins! 🤖";
                computerScore++;
                document.getElementById('winner-text').style.color = '#ff4d4d';
            }

            document.getElementById('winner-text').textContent = result;
            document.getElementById('player-score').textContent = playerScore;
            document.getElementById('computer-score').textContent = computerScore;
        }

        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            document.getElementById('player-score').textContent = '0';
            document.getElementById('computer-score').textContent = '0';
            document.getElementById('choices-display').textContent = 'Choose your weapon!';
            document.getElementById('winner-text').textContent = '';
        }
    </script>

</body>
</html>
